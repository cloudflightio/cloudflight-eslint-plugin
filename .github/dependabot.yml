# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
    - package-ecosystem: 'npm' # See documentation for possible values
      directory: '/' # Location of package manifests
      schedule:
          interval: 'monthly'
      # raises the ranges with the lockfile, a new minor of a rule provider comes as an update with new snapshots
      versioning-strategy: increase
      groups:
          # eslint, typescript-eslint and the plugins have peer dependencies on each other, update them together
          eslint-ecosystem:
              patterns:
                  - 'eslint'
                  - '@eslint/*'
                  - 'eslint-*'
                  - '@typescript-eslint/*'
                  - 'typescript-eslint'
                  - 'typescript'
                  - '@stylistic/eslint-plugin'
                  - 'angular-eslint'
                  - '@vue/eslint-config-typescript'
                  - 'vue-eslint-parser'
              # eslint-plugin-react does not support eslint 10 yet and runs through @eslint/compat, check its releases by hand
              # see: https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
              exclude-patterns:
                  - 'eslint-plugin-react'
                  - 'eslint-plugin-jsx-a11y'
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          # Check for updates to GitHub Actions every week
          interval: 'monthly'
